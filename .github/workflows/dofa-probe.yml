name: DOFA probe

# Test temporaire : est-ce que les runners GitHub peuvent joindre l'API FFF ?
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Runner public IP
        run: curl -s https://api.ipify.org; echo

      - name: Probe DOFA (clubs/100405/equipes)
        run: |
          code=$(curl -s -o /tmp/body -w "%{http_code}" \
            -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36" \
            -H "Accept: application/json, text/plain, */*" \
            -H "Accept-Language: fr-FR,fr;q=0.9" \
            -H "Referer: https://www.fff.fr/" \
            "https://api-dofa.fff.fr/api/clubs/100405/equipes")
          echo "HTTP_STATUS=$code"
          echo "BODY_LEN=$(wc -c < /tmp/body)"
          echo "----- first 400 chars -----"
          head -c 400 /tmp/body || true
          echo
